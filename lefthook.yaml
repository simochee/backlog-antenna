commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit $1

pre-commit:
  commands:
    prettier:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: |-
        npx prettier \
          --write \
          --ignore-unknown \
          {staged_files} \
        && git update-index --again

    sort-package-json:
      glob: package.json
      run: |-
        npx sort-package-json \
        && git update-index --again
