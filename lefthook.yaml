commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit $1

pre-commit:
  commands:
    prettier:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      stage_fixed: true
      run: |-
        npx @biomejs/biome check \
          --write \
          --unsafe \
          --no-errors-on-unmatched \
          --colors=off \
          {staged_files}

    sort-package-json:
      glob: package.json
      run: |-
        npx sort-package-json \
        && git update-index --again
